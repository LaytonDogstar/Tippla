<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#244CCD">
  <title>Tippla · Offline</title>
  <style>
    :root { color-scheme: light dark; --bg: #FBFCFF; --text: #14161A; --muted: #4B5263; --accent: #244CCD; }
    @media (prefers-color-scheme: dark) { :root { --bg: #14161A; --text: #F2F4F8; --muted: #B4BACB; --accent: #ABC0FF; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { color: var(--muted); }
    a { color: var(--accent); display: inline-block; min-height: 44px; line-height: 44px; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Tippla needs a connection to refresh your numbers. Pages you've opened recently still work, and Today shows when it was last updated.</p>
    <p>If money's tight right now, the National Debt Helpline is free on <a href="tel:1800007007">1800 007 007</a>.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
